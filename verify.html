<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — Zafar</title>
<link rel="stylesheet" href="style.css?v=20260901b">
</head>
<body>
  <div class="card">
    <div class="brand-mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.837l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
      <span class="verified-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </div>
    <div class="wordmark">Zafar</div>
    <p class="tagline">Past papers, notes &amp; marking keys for MANEB success</p>

    <h1>Verify your email</h1>
    <p class="subtitle">Enter the 6-digit code we sent to<br><span class="verify-email" id="verifyEmail"></span></p>

    <form id="verifyForm">
      <div class="otp-row" id="otpRow">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" data-index="0">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="1">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="2">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="3">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="4">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="5">
      </div>

      <p id="formSuccess" style="color:#0f9d72; font-size:14px; margin:4px 0 16px; display:none; text-align:center;"></p>
      <p id="formError" style="color:#c0392b; font-size:14px; margin:4px 0 16px; display:none; text-align:center;"></p>

      <button type="submit" class="submit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span class="btn-label">Verify</span>
      </button>
    </form>

    <p class="resend-row">Didn't get a code? <button type="button" class="resend-link" id="resendBtn">Resend code</button></p>
    <p class="switch-link">Wrong email? <a href="register.html">Start over</a></p>
    <p class="auth-footer">© 2026 Zafar · Built for Malawian students</p>
  </div>

  <script src="config.js?v=20260901b"></script>
  <script src="verify.js?v=20260901b"></script>
</body>
</html>
