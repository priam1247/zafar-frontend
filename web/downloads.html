<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006D7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyMW">
<!-- Installed apps have no browser chrome above the page, so the bar needs
     its own room for the status bar (see .app-bar in app.css). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>My Downloads — StudyMW</title>
<meta name="description" content="The documents you have downloaded on this phone, and how to find each one again in the library.">
<link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<!-- The mark, in every size a browser, an installed app or a search engine
     can ask for. 48, 96, 144 and 192 are multiples of 48 on purpose: that is
     the shape Google puts beside a result. tools/make-icons.py draws all of
     them, and icon.svg, from the same curves. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/img/icon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/img/icon-96.png">
<link rel="icon" type="image/png" sizes="144x144" href="assets/img/icon-144.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="mask-icon" href="assets/img/safari-pinned-tab.svg" color="#006D7C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="canonical" href="https://studymw.netlibrary.dpdns.org/downloads.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StudyMW">
<meta property="og:title" content="My Downloads — StudyMW">
<meta property="og:description" content="The documents you have downloaded on this phone, and how to find each one again in the library.">
<meta property="og:url" content="https://studymw.netlibrary.dpdns.org/downloads.html">
<meta property="og:image" content="https://studymw.netlibrary.dpdns.org/assets/img/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="StudyMW — MSCE and JCE past papers, marking keys, books and notes">
<meta name="twitter:card" content="summary_large_image">
<!-- One description of the site and its logo, so a search engine can name it
     and draw the mark beside the name. The url and the logo are absolute:
     a crawler will not guess them from a relative path. -->
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"StudyMW","alternateName":"Study MW","url":"https://studymw.netlibrary.dpdns.org/","inLanguage":"en","publisher":{"@type":"EducationalOrganization","name":"StudyMW","url":"https://studymw.netlibrary.dpdns.org/","logo":{"@type":"ImageObject","url":"https://studymw.netlibrary.dpdns.org/assets/img/icon-512.png","width":512,"height":512}}}
</script>
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var t = ZafarI18n.t;
      var p = t("pages.downloads");
      var shell = ZafarShell.init({ active: "downloads", title: p.title, crumb: p.crumb });
      if (!shell) return;

      // The list lives on this phone, per account (config.js scopes the key by
      // the token's subject). There is no server route that returns a
      // student's download history — /drive/papers is the library, and the
      // admin audit log is not theirs to read — so this is what the app can
      // honestly show: what was saved here, and a way back to each document.
      var root = shell.content;

      // A history row remembers its section, so "Find it again" opens the
      // shelf that holds it.
      var SECTIONS = {
        books: "books.html",
        papers: "dashboard.html",
        primary: "dashboard.html",
        notes: "notes.html",
        "marking-keys": "marking-keys.html",
      };

      function when(iso) {
        var then = new Date(iso);
        if (isNaN(then.getTime())) return "";
        var today = new Date();
        var sameDay = then.toDateString() === today.toDateString();
        if (sameDay) return "Today " + then.toTimeString().slice(0, 5);
        return then.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      }

      function render() {
        var rows = Zafar.getRecentDownloads();
        shell.count.textContent = rows.length
          ? t("downloads.count", rows.length)
          : t("downloads.emptyTitle");

        if (!rows.length) {
          root.innerHTML =
            '<div class="state show">' + ZafarShell.svg("downloaded", 38) +
              "<h3>" + t("downloads.emptyTitle") + "</h3>" +
              "<p>" + t("downloads.emptyBody") + "</p>" +
              '<a class="btn btn-primary" href="books.html">' + t("downloads.browseBooks") + "</a>" +
            "</div>";
          return;
        }

        root.innerHTML =
          '<ul class="saved-list">' + rows.map(function (row) {
            var name = Zafar.escapeHTML((row.name || "").replace(/\.pdf$/i, ""));
            // Back to the shelf the file came from, not always to Books.
            var href = SECTIONS[row.section] || "books.html";
            return '<li class="saved-row">' +
              '<span class="glyph-tile">' + ZafarShell.svg("file", 19) + "</span>" +
              '<span class="saved-text">' +
                '<span class="saved-title">' + name + "</span>" +
                '<span class="saved-meta">' +
                  Zafar.escapeHTML(row.category || t("list.document")) +
                  " · " + Zafar.escapeHTML(when(row.at)) +
                "</span>" +
              "</span>" +
              '<a class="btn btn-ghost btn-sm" href="' + href + '?q=' +
                encodeURIComponent((row.name || "").replace(/\.pdf$/i, "")) + '">' +
                t("downloads.find") + "</a>" +
            "</li>";
          }).join("") + "</ul>" +
          '<p class="saved-note">' + t("downloads.note") + "</p>" +
          '<button type="button" class="btn btn-ghost" data-clear-history>' +
            t("downloads.clear") + "</button>";

        var clear = root.querySelector("[data-clear-history]");
        if (clear) clear.addEventListener("click", function () {
          try {
            localStorage.removeItem(
              Zafar.RECENT_DOWNLOADS_KEY + "_" + Zafar._currentUserSuffix()
            );
          } catch (e) {}
          shell.showToast(t("downloads.cleared"), "check");
          render();
        });
      }

      render();
    });
  </script>
</body>
</html>
