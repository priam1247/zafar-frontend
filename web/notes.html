<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006D7C">
<title>Notes — Zafar</title>
<meta name="description" content="Condensed subject notes for every form.">
<link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/list.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var p = ZafarI18n.t("pages.notes");
      var shell = ZafarShell.init({ active: "notes", title: p.title, crumb: p.crumb, desc: p.desc });
      if (!shell) return;
      ZafarList.init({
        section: "notes",
        quotaKey: "notes",
        itemLabel: p.itemLabel,
        searchPlaceholder: p.searchPlaceholder,
        categories: ["Senior", "Junior"],
      }, shell);
    });
  </script>
</body>
</html>
