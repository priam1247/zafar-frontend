<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c3a2d">
<title>Favorites — Zafar</title>
<meta name="description" content="Documents you saved for quick access.">
<link rel="stylesheet" href="assets/css/app.css">
<script>try{var t=localStorage.getItem("zafar_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/list.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var p = ZafarI18n.t("pages.favorites");
      var shell = ZafarShell.init({ active: "favorites", title: p.title, crumb: p.crumb });
      if (!shell) return;
      // Favorites are stored per-account as a list of document ids, so the
      // page loads each section and keeps only the saved rows.
      ZafarList.init({
        sections: ["papers", "books", "notes", "marking-keys"],
        section: "papers",
        quotaKey: null,
        favoritesOnly: true,
        itemLabel: p.itemLabel,
        searchPlaceholder: p.searchPlaceholder,
      }, shell);
    });
  </script>
</body>
</html>
