<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c3a2d">
<title>Help &amp; FAQ — Zafar</title>
<meta name="description" content="Answers to common questions about downloads, limits and favorites on Zafar.">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var t = ZafarI18n.t;
      var p = t("pages.help");
      var shell = ZafarShell.init({ active: "help", title: p.title, crumb: p.crumb });
      if (!shell) return;

      var QA = t("help.qa");

      shell.content.innerHTML =
        '<section class="hero"><div><h2>' + t("help.heroTitle") + "</h2>" +
        "<p>" + t("help.heroBody") + "</p></div>" +
        '<div class="hero-actions"><a class="btn btn-primary" href="dashboard.html">' + t("help.backToPapers") + "</a></div></section>" +

        '<div class="grid grid-stats">' +
          '<div class="stat"><div class="stat-head"><span class="stat-glyph">' + ZafarShell.svg("bolt", 17) +
          '</span><span class="stat-label">' + t("help.dailyLimitLabel") + '</span></div><div class="stat-value">' + DAILY_PAPER_LIMIT +
          '</div><div class="stat-foot">' + t("help.dailyLimitFoot") + "</div></div>" +
          '<div class="stat"><div class="stat-head"><span class="stat-glyph">' + ZafarShell.svg("clock", 17) +
          '</span><span class="stat-label">' + t("help.limitResetsLabel") + '</span></div><div class="stat-value">00:00</div>' +
          '<div class="stat-foot">' + t("help.limitResetsFoot") + "</div></div>" +
          '<div class="stat"><div class="stat-head"><span class="stat-glyph">' + ZafarShell.svg("layers", 17) +
          '</span><span class="stat-label">' + t("help.sectionsLabel") + '</span></div><div class="stat-value">4</div>' +
          '<div class="stat-foot">' + t("help.sectionsFoot") + "</div></div>" +
        "</div>" +

        (SUPPORT_WHATSAPP
          ? '<a class="panel contact-card" href="https://wa.me/' + encodeURIComponent(SUPPORT_WHATSAPP) +
            '" target="_blank" rel="noopener">' +
              '<span class="stat-glyph">' + ZafarShell.svg("help", 18) + "</span>" +
              "<div><h3>" + t("help.contactTitle") + "</h3><p>" + t("help.contactBody") + "</p></div>" +
              '<span class="contact-cta">' + t("help.contactCta") + ZafarShell.svg("bolt", 15) + "</span>" +
            "</a>"
          : "") +

        '<section class="stack"><div class="section-head"><h2>' + t("help.faqTitle") + "</h2></div>" +
        '<label class="search">' + ZafarShell.svg("search", 18) +
          '<input type="search" data-faq-search placeholder="' + Zafar.escapeHTML(t("help.searchPlaceholder")) + '" aria-label="Search questions">' +
        "</label>" +
        '<div class="panel" data-faq-list>' +
          QA.map(function (item) {
            return '<details class="qa" id="' + item.id + '"><summary>' + item.q +
              '</summary><div class="qa-body">' + item.a + "</div></details>";
          }).join("") +
        "</div>" +
        '<div class="state" data-faq-empty>' + ZafarShell.svg("search", 40) +
          "<h3>" + t("help.noMatchesTitle") + "</h3><p>" + t("help.noMatchesBody") + "</p></div>" +
        "</section>" +

        '<section class="stack"><div class="section-head"><h2>' + t("help.shortcutsTitle") + "</h2></div>" +
        '<div class="panel list">' +
          '<div class="list-row"><span class="lines"><span class="name">/</span>' +
          '<span class="sub">' + t("help.shortcutSlash") + '</span></span></div>' +
          '<div class="list-row"><span class="lines"><span class="name">Esc</span>' +
          '<span class="sub">' + t("help.shortcutEsc") + "</span></span></div>" +
        "</div></section>";

      function renderCount(n) {
        shell.count.textContent = t("help.answers", n);
      }
      renderCount(QA.length);

      /* ---------- Live FAQ filter ---------- */
      var searchInput = shell.content.querySelector("[data-faq-search]");
      var faqList = shell.content.querySelector("[data-faq-list]");
      var faqEmpty = shell.content.querySelector("[data-faq-empty]");
      var items = Array.prototype.slice.call(faqList.querySelectorAll(".qa"));

      function filterFaq() {
        var q = (searchInput.value || "").trim().toLowerCase();
        var visible = 0;
        items.forEach(function (row) {
          var show = !q || row.textContent.toLowerCase().indexOf(q) !== -1;
          row.style.display = show ? "" : "none";
          if (show) visible++;
        });
        faqList.style.display = visible ? "" : "none";
        faqEmpty.classList.toggle("show", visible === 0);
        renderCount(visible);
      }
      searchInput.addEventListener("input", filterFaq);

      // Deep links like help.html#password open the matching question.
      if (location.hash) {
        var target = document.querySelector(location.hash);
        if (target && target.tagName === "DETAILS") {
          target.open = true;
          target.scrollIntoView({ block: "center" });
        }
      }
    });
  </script>
</body>
</html>
