<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006D7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyMW">
<!-- Installed apps have no browser chrome above the page, so the bar needs
     its own room for the status bar (see .app-bar in app.css). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Help &amp; FAQ — StudyMW</title>
<meta name="description" content="Answers to common questions about downloads, limits and saved files on StudyMW — and a way to ask for a paper that is missing or report one that does not work.">
<link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<!-- The mark, in every size a browser, an installed app or a search engine
     can ask for. 48, 96, 144 and 192 are multiples of 48 on purpose: that is
     the shape Google puts beside a result. tools/make-icons.py draws all of
     them, and icon.svg, from the same curves. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/img/icon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/img/icon-96.png">
<link rel="icon" type="image/png" sizes="144x144" href="assets/img/icon-144.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="mask-icon" href="assets/img/safari-pinned-tab.svg" color="#006D7C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="canonical" href="https://studymw.netlibrary.dpdns.org/help.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StudyMW">
<meta property="og:title" content="Help &amp; FAQ — StudyMW">
<meta property="og:description" content="Answers to common questions about downloads, limits and saved files on StudyMW — and a way to ask for a paper that is missing or report one that does not work.">
<meta property="og:url" content="https://studymw.netlibrary.dpdns.org/help.html">
<meta property="og:image" content="https://studymw.netlibrary.dpdns.org/assets/img/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="StudyMW — MSCE and JCE past papers, marking keys, books and notes">
<meta name="twitter:card" content="summary_large_image">
<!-- One description of the site and its logo, so a search engine can name it
     and draw the mark beside the name. The url and the logo are absolute:
     a crawler will not guess them from a relative path. -->
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"StudyMW","alternateName":"Study MW","url":"https://studymw.netlibrary.dpdns.org/","inLanguage":"en","publisher":{"@type":"EducationalOrganization","name":"StudyMW","url":"https://studymw.netlibrary.dpdns.org/","logo":{"@type":"ImageObject","url":"https://studymw.netlibrary.dpdns.org/assets/img/icon-512.png","width":512,"height":512}}}
</script>
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var t = ZafarI18n.t;
      var p = t("pages.help");
      var QA = t("help.qa");
      var shell = ZafarShell.init({
        active: "help",
        title: p.title,
        lede: t("help.answers", QA.length),
      });
      if (!shell) return;
      // The library's folder keys, in the order the app shows them. `primary`
      // is its own folder even though it spends the papers allowance. The
      // labels come from the string table, like every other name on the page.
      var REQUEST_SECTIONS = ["papers", "primary", "books", "notes", "marking-keys"];
      var icon = ZafarShell.svg;

      shell.content.innerHTML =
        '<section class="folio">' +
          '<h2>' + t("help.heroTitle") + "</h2>" +
          "<p>" + t("help.heroBody") + "</p>" +
          '<a class="btn btn-on-teal btn-sm" href="dashboard.html">' + t("help.backToPapers") + "</a>" +
        "</section>" +

        // Four allowances, one row each. The figures are filled in below from
        // /auth/quota — the same answer the header chips read — because an
        // administrator can change DAILY_*_LIMIT without touching this site.
        // Until that answer arrives the rows hold a dash rather than a guess.
        '<section class="panel limits">' +
          '<h2 class="limits-title">' + t("help.limitsTitle") + "</h2>" +
          '<ul class="limit-rows">' +
            QUOTA_SECTIONS.map(function (section) {
              return "<li><span>" + t("help.limitRow." + section) + "</span>" +
                '<b data-limit="' + section + '">—</b></li>';
            }).join("") +
          "</ul>" +
          '<p class="limits-note" data-limits-note>' + t("help.limitsNote") + "</p>" +
        "</section>" +

        (SUPPORT_WHATSAPP
          ? '<a class="panel contact-card" href="https://wa.me/' + encodeURIComponent(SUPPORT_WHATSAPP) +
            '" target="_blank" rel="noopener">' +
              '<span class="stat-glyph">' + icon("help", 15) + "</span>" +
              "<div><h3>" + t("help.contactTitle") + "</h3><p>" + t("help.contactBody") + "</p></div>" +
              '<span class="contact-cta">' + t("help.contactCta") + icon("bolt", 13) + "</span>" +
            "</a>"
          : "") +

        // Asking for a file that is not here yet. POST /requests with the
        // bearer token: the API attributes it to this account, so no email is
        // typed or sent. The form is the whole panel, so the anchor link from
        // the FAQ ("send the request through") lands on something usable.
        '<section class="stack" id="request">' +
          '<div class="section-head"><h2>' + t("support.requestTitle") + "</h2></div>" +
          '<form class="panel" data-request-form novalidate>' +
            '<p class="form-lede">' + t("support.requestBody") + "</p>" +
            '<div class="form-field">' +
              '<label for="request-section">' + t("support.requestSection") + "</label>" +
              '<select class="form-select" id="request-section">' +
                REQUEST_SECTIONS.map(function (key) {
                  return '<option value="' + key + '">' +
                    Zafar.escapeHTML(t("support.sections." + key)) + "</option>";
                }).join("") +
              "</select>" +
            "</div>" +
            '<div class="form-field">' +
              '<label for="request-title">' + t("support.requestWhat") + "</label>" +
              // maxlength matches the API's own cap (Field(max_length=160)):
              // stopping the typing is kinder than a 422 after it.
              '<input class="form-input" id="request-title" type="text" maxlength="160" ' +
                'autocomplete="off" placeholder="' + Zafar.escapeHTML(t("support.requestWhatPh")) + '">' +
            "</div>" +
            '<div class="form-field">' +
              '<label for="request-note">' + t("support.requestNote") +
                ' <span class="form-optional">' + t("support.requestOptional") + "</span></label>" +
              '<textarea class="form-textarea" id="request-note" rows="3" maxlength="2000" placeholder="' +
                Zafar.escapeHTML(t("support.requestNotePh")) + '"></textarea>' +
            "</div>" +
            '<p class="form-error" role="alert" data-request-error hidden></p>' +
            '<div class="form-actions">' +
              '<button class="btn btn-primary" type="submit" data-request-send>' + t("support.requestSend") + "</button>" +
            "</div>" +
          "</form>" +
          '<div class="panel form-done" data-request-done hidden>' +
            '<span class="done-glyph">' + icon("check", 18) + "</span>" +
            "<h3>" + t("support.requestDoneTitle") + "</h3>" +
            "<p>" + t("support.requestDone") + "</p>" +
            '<button class="btn btn-ghost" type="button" data-request-again>' + t("support.requestAgain") + "</button>" +
          "</div>" +
        "</section>" +

        '<section class="stack">' +
          '<div class="section-head"><h2>' + t("help.faqTitle") + "</h2></div>" +
          '<label class="search">' + icon("search", 18) +
            '<input type="search" data-faq-search placeholder="' + Zafar.escapeHTML(t("help.searchPlaceholder")) + '" aria-label="Search questions">' +
          "</label>" +
          '<div class="panel" data-faq-list>' +
            QA.map(function (item) {
              return '<details class="qa" id="' + item.id + '"><summary>' + item.q +
                '</summary><div class="qa-body">' + item.a + "</div></details>";
            }).join("") +
          "</div>" +
          '<div class="state" data-faq-empty>' + icon("search", 38) +
            "<h3>" + t("help.noMatchesTitle") + "</h3><p>" + t("help.noMatchesBody") + "</p></div>" +
        "</section>" +

        '<section class="stack">' +
          '<div class="section-head"><h2>' + t("help.shortcutsTitle") + "</h2></div>" +
          '<div class="panel">' +
            '<div class="list-row"><span class="lines"><span class="name">/</span>' +
            '<span class="sub">' + t("help.shortcutSlash") + "</span></span></div>" +
          "</div>" +
        "</section>";

      function renderCount(n) {
        shell.count.textContent = t("help.answers", n);
      }
      renderCount(QA.length);

      /* ---------- Daily allowances, as the server keeps them ----------
         The chips on each section page report the allowance the server is
         actually enforcing, so this table has to read the same answer or the
         two disagree the moment an administrator changes DAILY_*_LIMIT. A
         number the server did not send is not invented here: the rows keep a
         dash until the answer arrives, and if it never arrives the published
         defaults appear marked as such. */
      var limitCells = {};
      QUOTA_SECTIONS.forEach(function (section) {
        limitCells[section] = shell.content.querySelector('[data-limit="' + section + '"]');
      });
      var limitNote = shell.content.querySelector("[data-limits-note]");
      var limitList = shell.content.querySelector(".limit-rows");

      function showLimits(numbers, note, areDefaults) {
        QUOTA_SECTIONS.forEach(function (section) {
          var cell = limitCells[section];
          if (!cell) return;
          var n = numbers[section];
          cell.textContent = typeof n === "number" ? String(n) : "—";
        });
        if (limitList) limitList.classList.toggle("is-default", !!areDefaults);
        if (limitNote && note) limitNote.textContent = note;
      }

      Zafar.authGet("/auth/quota")
        .then(function (q) {
          var numbers = {};
          var complete = true;
          QUOTA_SECTIONS.forEach(function (section) {
            var n = q ? q[QUOTA_FIELD[section] + "_limit"] : null;
            if (typeof n !== "number") complete = false;
            numbers[section] = typeof n === "number" ? n : null;
          });
          if (!complete) throw new Error("quota answer missing a limit");
          showLimits(numbers, t("help.limitsNote"), false);
        })
        .catch(function () {
          showLimits(DAILY_LIMITS, t("help.limitsNoteDefaults"), true);
        });

      /* ---------- Live FAQ filter ---------- */
      var searchInput = shell.content.querySelector("[data-faq-search]");
      var faqList = shell.content.querySelector("[data-faq-list]");
      var faqEmpty = shell.content.querySelector("[data-faq-empty]");
      var items = Array.prototype.slice.call(faqList.querySelectorAll(".qa"));

      function filterFaq() {
        var q = (searchInput.value || "").trim().toLowerCase();
        var visible = 0;
        items.forEach(function (row) {
          var show = !q || row.textContent.toLowerCase().indexOf(q) !== -1;
          row.style.display = show ? "" : "none";
          if (show) visible++;
        });
        faqList.style.display = visible ? "" : "none";
        faqEmpty.classList.toggle("show", visible === 0);
        renderCount(visible);
      }
      searchInput.addEventListener("input", filterFaq);

      /* ---------- Requesting a file that is not here ----------
         POST /requests {section, title, note?} with the bearer token. The
         section keys are the library's own folders, so a request lands in the
         same place the file will: a request that says "Past Papers" is one an
         editor can act on, where a free-typed one is a guess. */
      var requestForm = shell.content.querySelector("[data-request-form]");
      var requestDone = shell.content.querySelector("[data-request-done]");
      var requestError = shell.content.querySelector("[data-request-error]");
      var requestSend = shell.content.querySelector("[data-request-send]");
      var requestSending = false;

      // Typing clears the red border: it marked one empty box, and it has
      // stopped being true the moment a letter goes in.
      shell.content.querySelector("#request-title").addEventListener("input", function () {
        this.classList.remove("has-error");
        if (!shell.content.querySelector("[data-request-error]").hidden) {
          shell.content.querySelector("[data-request-error]").hidden = true;
        }
      });

      requestForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (requestSending) return;

        var title = shell.content.querySelector("#request-title");
        var note = shell.content.querySelector("#request-note");
        var section = shell.content.querySelector("#request-section").value;
        var what = (title.value || "").trim();

        requestError.hidden = true;
        title.classList.remove("has-error");
        if (!what) {
          title.classList.add("has-error");
          requestError.textContent = t("support.errFill");
          requestError.hidden = false;
          title.focus();
          return;
        }

        requestSending = true;
        requestSend.disabled = true;
        requestSend.textContent = t("support.requestSending");

        Zafar.submitRequest(section, what, (note.value || "").trim()).then(
          function () {
            requestSending = false;
            requestSend.disabled = false;
            requestSend.textContent = t("support.requestSend");
            title.classList.remove("has-error");
            requestError.hidden = true;
            requestForm.hidden = true;
            requestDone.hidden = false;
            var again = requestDone.querySelector("[data-request-again]");
            if (again) again.focus();
          },
          function (err) {
            requestSending = false;
            requestSend.disabled = false;
            requestSend.textContent = t("support.requestSend");
            requestError.textContent = Zafar.submitMessage(err);
            requestError.hidden = false;
          }
        );
      });

      // "Send another": the boxes are cleared, so a second request is a fresh
      // one rather than an accidental duplicate of the first.
      shell.content.querySelector("[data-request-again]").addEventListener("click", function () {
        requestForm.reset();
        requestDone.hidden = true;
        requestForm.hidden = false;
        var title = shell.content.querySelector("#request-title");
        if (title) title.focus();
      });

      // Deep links like help.html#password open the matching question.
      if (location.hash) {
        var target = document.querySelector(location.hash);
        if (target && target.tagName === "DETAILS") {
          target.open = true;
          target.scrollIntoView({ block: "center" });
        }
      }
    });
  </script>
</body>
</html>
