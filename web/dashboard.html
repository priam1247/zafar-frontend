<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006D7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyMW">
<!-- Installed apps have no browser chrome above the page, so the bar needs
     its own room for the status bar (see .app-bar in app.css). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<title>Past Papers — StudyMW</title>
<meta name="description" content="Browse and download MANEB MSCE, JCE and mock past papers.">
<link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/list.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var p = ZafarI18n.t("pages.papers");
      var shell = ZafarShell.init({ active: "papers", title: p.title, crumb: p.crumb });
      if (!shell) return; // not signed in — already navigating to login
      ZafarList.init({
        section: "papers",
        quotaKey: "papers",
        itemLabel: p.itemLabel,
        searchPlaceholder: p.searchPlaceholder,
        categories: ["MSCE Maneb", "JCE Maneb", "Mock", "Other Past Papers"],
      }, shell);
    });
  </script>
</body>
</html>
