<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006D7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyMW">
<!-- Installed apps have no browser chrome above the page, so the bar needs
     its own room for the status bar (see .app-bar in app.css). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Settings — StudyMW</title>
<meta name="description" content="Your StudyMW account, the data this phone remembers, and how to reset your password.">
<link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<!-- The mark, in every size a browser, an installed app or a search engine
     can ask for. 48, 96, 144 and 192 are multiples of 48 on purpose: that is
     the shape Google puts beside a result. tools/make-icons.py draws all of
     them, and icon.svg, from the same curves. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/img/icon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/img/icon-96.png">
<link rel="icon" type="image/png" sizes="144x144" href="assets/img/icon-144.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="mask-icon" href="assets/img/safari-pinned-tab.svg" color="#006D7C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="canonical" href="https://studymw.netlibrary.dpdns.org/settings.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StudyMW">
<meta property="og:title" content="Settings — StudyMW">
<meta property="og:description" content="Your StudyMW account, the data this phone remembers, and how to reset your password.">
<meta property="og:url" content="https://studymw.netlibrary.dpdns.org/settings.html">
<meta property="og:image" content="https://studymw.netlibrary.dpdns.org/assets/img/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="StudyMW — MSCE and JCE past papers, marking keys, books and notes">
<meta name="twitter:card" content="summary_large_image">
<!-- One description of the site and its logo, so a search engine can name it
     and draw the mark beside the name. The url and the logo are absolute:
     a crawler will not guess them from a relative path. -->
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"StudyMW","alternateName":"Study MW","url":"https://studymw.netlibrary.dpdns.org/","inLanguage":"en","publisher":{"@type":"EducationalOrganization","name":"StudyMW","url":"https://studymw.netlibrary.dpdns.org/","logo":{"@type":"ImageObject","url":"https://studymw.netlibrary.dpdns.org/assets/img/icon-512.png","width":512,"height":512}}}
</script>
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var t = ZafarI18n.t;
      var p = t("pages.settings");
      var shell = ZafarShell.init({ active: "settings", title: p.title, crumb: p.crumb });
      if (!shell) return;

      var root = shell.content;
      shell.count.textContent = t("settings.subtitle");
      var me = Zafar.getMe();

      // Nothing on this page is a preference the API can store — there is no
      // student settings route, and inventing toggles that quietly do nothing
      // would be worse than having none. What it does hold is what is true:
      // which account this phone is signed in as, what is remembered here, and
      // the one action that changes anything.
      root.innerHTML =
        '<section class="panel">' +
          '<h2 class="panel-title">' + t("settings.account") + "</h2>" +
          '<div class="kv"><span>' + t("settings.name") + "</span><b>" +
            Zafar.escapeHTML(Zafar.fullName()) + "</b></div>" +
          '<div class="kv"><span>' + t("settings.email") + "</span><b>" +
            Zafar.escapeHTML(me.email || t("settings.emailUnknown")) + "</b></div>" +
          '<p class="panel-note">' + t("settings.accountNote") + "</p>" +
        "</section>" +

        '<section class="panel">' +
          '<h2 class="panel-title">' + t("settings.data") + "</h2>" +
          '<div class="kv"><span>' + t("settings.history") + "</span><b>" +
            Zafar.getRecentDownloads().length + "</b></div>" +
          '<p class="panel-note">' + t("settings.dataNote") + "</p>" +
          '<div class="panel-actions">' +
            '<a class="btn btn-ghost" href="downloads.html">' + t("nav.myDownloads") + "</a>" +
            '<button type="button" class="btn btn-ghost" data-clear-history>' +
              t("settings.clearHistory") + "</button>" +
          "</div>" +
        "</section>" +

        '<section class="panel">' +
          '<h2 class="panel-title">' + t("settings.password") + "</h2>" +
          '<p class="panel-note">' + t("settings.passwordNote") + "</p>" +
          '<div class="panel-actions">' +
            '<a class="btn btn-ghost" href="login.html#forgot">' + t("settings.resetPassword") + "</a>" +
          "</div>" +
        "</section>" +

        '<section class="panel">' +
          '<h2 class="panel-title">' + t("settings.about") + "</h2>" +
          '<p class="panel-note">' + t("settings.aboutNote") + "</p>" +
          '<div class="panel-actions">' +
            '<a class="btn btn-ghost" href="help.html">' + t("nav.help") + "</a>" +
          "</div>" +
        "</section>" +

        '<div class="panel-actions">' +
          '<button type="button" class="btn btn-danger-soft" data-logout-here>' +
            ZafarShell.svg("logout", 20) + "<span>" + t("shell.logOut") + "</span>" +
          "</button>" +
        "</div>";

      var clear = root.querySelector("[data-clear-history]");
      if (clear) clear.addEventListener("click", function () {
        try {
          localStorage.removeItem(Zafar.RECENT_DOWNLOADS_KEY + "_" + Zafar._currentUserSuffix());
        } catch (e) {}
        shell.showToast(t("downloads.cleared"), "check");
        var kv = root.querySelectorAll(".kv b");
        if (kv.length > 1) kv[1].textContent = "0";
      });

      // Signing out from here uses the same one function the drawer uses, so
      // the account's cached role and name leave with the token.
      var out = root.querySelector("[data-logout-here]");
      if (out) out.addEventListener("click", function () {
        Zafar.signOut();
        location.href = "login.html";
      });
    });
  </script>
</body>
</html>
