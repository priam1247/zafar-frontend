<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c3a2d">
<title>Books — Zafar</title>
<meta name="description" content="Browse and download senior and junior secondary school textbooks.">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/list.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var p = ZafarI18n.t("pages.books");
      var shell = ZafarShell.init({ active: "books", title: p.title, crumb: p.crumb });
      if (!shell) return;
      ZafarList.init({
        section: "books",
        quotaKey: "books",
        itemLabel: p.itemLabel,
        searchPlaceholder: p.searchPlaceholder,
        categories: ["Senior", "Junior"],
      }, shell);
    });
  </script>
</body>
</html>
